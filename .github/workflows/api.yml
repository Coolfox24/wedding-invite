name: Build ARM64 wedding image

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'server/**'
      - 'tests/**'
      - 'deploy/**'
      - 'tsconfig.server.json'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/api.yml'
      - '.github/scripts/**'
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'server/**'
      - 'tests/**'
      - 'deploy/**'
      - 'tsconfig.server.json'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/api.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wedding-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Select image name and publishing policy
        id: image
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          publish=false
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]] && \
             { [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]] || \
               [[ "$GITHUB_REF" == refs/tags/v* ]] || \
               [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; }; then
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image tags
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build ARM64 frontend and API image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          push: false
          tags: |
            wedding-invite:ci
            ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=wedding-arm64
          cache-to: type=gha,mode=max,scope=wedding-arm64
          # Docker's local image exporter is used for testing before publishing.
          provenance: false

      - name: Test image and persistent database
        shell: bash
        run: bash .github/scripts/test-image.sh wedding-invite:ci

      - name: Log in to GitHub Container Registry
        if: steps.image.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image
        if: steps.image.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          # Reuse the same builder, context, platform and labels as the tested
          # build. Export directly to GHCR instead of pushing the daemon-loaded
          # copy, avoiding a second serialization of the image's layers.
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=wedding-arm64
          cache-to: type=gha,mode=max,scope=wedding-arm64
          provenance: false
