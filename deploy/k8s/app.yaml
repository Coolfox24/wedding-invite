apiVersion: v1
kind: Namespace
metadata:
  name: wedding
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wedding-api
  namespace: wedding
data:
  HOST: "0.0.0.0"
  PORT: "3001"
  DATABASE_PATH: /data/rsvp.sqlite
  # Replace with the exact browser origin(s), comma separated, with no trailing slash.
  # During the GitHub Pages transition, add https://YOUR-USERNAME.github.io.
  ALLOWED_ORIGINS: https://wedding.example.com
  # This is the FRONTEND URL placed in the generated invitation links.
  PUBLIC_BASE_URL: https://wedding.example.com/
  TRUST_CLOUDFLARE_PROXY: "true"
  RATE_LIMIT_PER_IP: "120"
  RATE_LIMIT_PER_INVITE: "30"
  # Optional: end of 11 December 2026 in Sydney. Remove to permit replies indefinitely.
  RSVP_CLOSES_AT: "2026-12-11T23:59:59+11:00"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wedding-data
  namespace: wedding
spec:
  accessModes: [ReadWriteOnce]
  # Set storageClassName to a local/block-backed class with correct SQLite locking.
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wedding-api
  namespace: wedding
spec:
  replicas: 1
  # Avoid two SQLite writers/pods during rolling upgrades.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wedding-api
  template:
    metadata:
      labels:
        app: wedding-api
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Build/push the Dockerfile, then replace with your registry and immutable tag/digest.
          image: YOUR-REGISTRY/wedding-api:CHANGE-ME
          envFrom:
            - configMapRef:
                name: wedding-api
          ports:
            - name: http
              containerPort: 3001
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: wedding-data
---
apiVersion: v1
kind: Service
metadata:
  name: wedding-api
  namespace: wedding
spec:
  type: ClusterIP
  selector:
    app: wedding-api
  ports:
    - name: http
      port: 3001
      targetPort: http
---
# Requires a CNI that enforces NetworkPolicy. Keep proxy-header trust disabled if
# callers can bypass cloudflared and send forged CF-Connecting-IP headers.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wedding-api
  namespace: wedding
spec:
  podSelector:
    matchLabels:
      app: wedding-api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: cloudflared
      ports:
        - protocol: TCP
          port: 3001
  egress: []
